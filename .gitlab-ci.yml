---
include:
  - project: nci-gdc/gitlab-templates
    ref: master
    file:
      - templates/global/full.yaml
      - templates/python/full.yaml

variables:
  BUILD_PY_VERSION: python3.9
  RELEASE_PY_VERSION: python3.9
  BASE_CONTAINER_VERSION: "latest"
  BASE_CONTAINER_REGISTRY: "docker.osdc.io/ncigdc"
  GIT_DEPTH: "0"

default:
  image: docker.osdc.io/ncigdc/python3.9-builder:latest

# ---------------------------------------------------------------------------
# MUST COME LAST — overrides the template's python-base definition
# ---------------------------------------------------------------------------
.python-base:
  image: docker.osdc.io/ncigdc/python3.9-builder:latest
